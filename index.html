<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário</title>
</head>
<body>
    <h2 class="titulo">Cadastro de Clientes!</h2>
    <div class="form">
        <form>
            <h4 class="cadastro">Nome completo:</h4>
            <input type="text" name="nome" placeholder="Insira seu nome" class="inserir"><br><br>

            <h4 class="cadastro">Nascimento:</h4>
            <input type="date" name="nascimento" class="inserir"><br><br>

            <h4 class="cadastro">Telefone:</h4>
            <input type="tel" name="telefone" placeholder="(21) 90123-4567" class="inserir"><br><br>

            <h4 class="cadastro">Email:</h4>
            <input type="text" name="email" placeholder="exemplo@gmail.com" class="inserir">
            <input type="text" name="email" placeholder="Confirme seu email" class="inserir"><br><br>

            <h4 class="cadastro">Senha:</h4>
            <input type="password" name="senha" placeholder="Insira sua senha" class="inserir">
            <input type="password" name="senha" placeholder="Confirme sua senha" class="inserir"><br><br>

            <h4 class="cadastro">Envie seu currículo:</h4>
            <input type="file" name="curriculo" class="inserir"><br><br><br>
                
            <input type="submit" name="ENVIAR" class="botao">
            <input type="reset" name="CANCELAR" class="botao2">
    </div>
</body>
</html>
